<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#14213d" />
      <stop offset="60%" stop-color="#090d18" />
      <stop offset="100%" stop-color="#05070d" />
    </radialGradient>
    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Orange Glow Filter -->
    <filter id="orangeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Laser Shard Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGlow)" />

  <!-- Perspective Grid lines -->
  <g stroke="rgba(0, 240, 255, 0.08)" stroke-width="1">
    <line x1="100" y1="0" x2="0" y2="450" />
    <line x1="250" y1="0" x2="160" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="550" y1="0" x2="640" y2="450" />
    <line x1="700" y1="0" x2="800" y2="450" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="360" x2="800" y2="360" />
  </g>

  <!-- Distant Asteroid Hazard -->
  <g transform="translate(180, 110)" filter="url(#orangeGlow)">
    <polygon points="0,-40 32,-24 44,12 18,38 -24,32 -38,4 -22,-28" fill="#140f1a" stroke="#ff7700" stroke-width="2.5" />
    <circle cx="-6" cy="-8" r="8" fill="none" stroke="#ff7700" stroke-width="1.5" stroke-dasharray="3,3" />
    <circle cx="14" cy="12" r="5" fill="none" stroke="#ff7700" stroke-width="1" />
  </g>

  <!-- Large Asteroid Hazard (Right) -->
  <g transform="translate(620, 180)" filter="url(#orangeGlow)">
    <polygon points="-10,-60 38,-45 58,10 32,55 -30,50 -55,0 -40,-45" fill="#19111c" stroke="#ff7700" stroke-width="3" />
    <circle cx="-12" cy="6" r="14" fill="none" stroke="#ff7700" stroke-width="2" />
    <circle cx="20" cy="-18" r="8" fill="none" stroke="#ff7700" stroke-width="1.5" />
  </g>

  <!-- Incoming Laser Shards -->
  <line x1="290" y1="40" x2="290" y2="200" stroke="url(#laserGrad)" stroke-width="4" stroke-linecap="round" filter="url(#cyanGlow)" />
  <line x1="510" y1="80" x2="510" y2="260" stroke="url(#laserGrad)" stroke-width="5" stroke-linecap="round" filter="url(#cyanGlow)" />

  <!-- Speed Particles / Stardust -->
  <circle cx="120" cy="80" r="1.5" fill="#00f0ff" opacity="0.6" />
  <circle cx="340" cy="60" r="2" fill="#ffffff" opacity="0.8" />
  <circle cx="480" cy="140" r="1.5" fill="#00f0ff" opacity="0.7" />
  <circle cx="680" cy="90" r="2.5" fill="#ff7700" opacity="0.8" />
  <circle cx="220" cy="290" r="1" fill="#ffffff" opacity="0.5" />
  <circle cx="580" cy="340" r="1.5" fill="#00f0ff" opacity="0.6" />

  <!-- Player Neon Fighter Craft (Center-Bottom) -->
  <g transform="translate(400, 340)" filter="url(#cyanGlow)">
    <!-- Thruster Exhaust Particles -->
    <path d="M-8,30 L0,65 L8,30 Z" fill="#ff7700" filter="url(#orangeGlow)" />
    <path d="M-4,30 L0,50 L4,30 Z" fill="#ffffaa" />
    <!-- Ship Body Silhouette -->
    <polygon points="0,-48 34,22 18,28 0,16 -18,28 -34,22" fill="#0c111c" stroke="#00f0ff" stroke-width="2.5" />
    <!-- Cockpit Core -->
    <polygon points="0,-24 8,4 0,10 -8,4" fill="#00f0ff" />
    <!-- Wing Trim Lines -->
    <line x1="12" y1="8" x2="28" y2="20" stroke="#ff7700" stroke-width="2" />
    <line x1="-12" y1="8" x2="-28" y2="20" stroke="#ff7700" stroke-width="2" />
  </g>
</svg>
