<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00f0ff" />
      <stop offset="1" stop-color="#0088ff" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="32" y1="20" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff9900" />
      <stop offset="1" stop-color="#ff4400" />
    </linearGradient>
  </defs>
  <!-- Outer diamond ring -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="#0c111c" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
  <!-- Spacecraft delta silhouette -->
  <path d="M32 14 L46 46 L32 38 L18 46 Z" fill="url(#cyanGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Core thruster flame -->
  <path d="M28 42 L32 54 L36 42 Z" fill="url(#orangeGrad)" filter="url(#glow)"/>
</svg>
